{% extends 'core/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 420px; border-radius: 12px;">

        <h3 class="mb-3 text-center">Entrar</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary w-100 mt-3">Entrar</button>
        </form>

        <p class="text-center mt-3">
            Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>

    </div>
</div>
{% endblock %}
