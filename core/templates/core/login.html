{% extends 'core/base.html' %}
{% block title %}Login - {{ pagina_global.nome_do_site }}{% endblock %}

{% block content %}
<div class="container" style="max-width:420px;">
  <div class="section-card mt-4">
    <h3 class="center mb-3">Entrar</h3>

    {% if form.errors %}
      <div class="alert alert-danger">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-muted-2">Usuário</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-muted-2">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button class="btn-primary w-100">Entrar</button>
    </form>

    <p class="center text-muted-2 mt-3">ou <a href="{% url 'cadastro' %}">criar conta</a></p>
  </div>
</div>
{% endblock %}
