{% extends 'core/base.html' %}
{% block title %}{{ produto.nome }} - {{ pagina_global.nome_do_site }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 980px;">
  <div class="section-card mt-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-6 text-center">
        <img src="{{ produto.foto.url }}" alt="{{ produto.nome }}" style="width:100%; max-height:420px; object-fit:cover; border-radius:8px;">
      </div>
      <div class="col-md-6">
        <h2>{{ produto.nome }}</h2>
        <p class="text-muted-2">{{ produto.descricao }}</p>
        <p class="preco">R$ {{ produto.preco }}</p>
        <p class="text-muted-2">Estoque: {{ produto.estoque }}</p>

        <form method="post" action="{% url 'pedido' produto.id %}">
          {% csrf_token %}
          <div class="mb-2">
            <label class="form-label text-muted-2">Quantidade</label>
            <input type="number" name="quantidade" min="1" max="{{ produto.estoque }}" value="1" class="form-control" style="max-width:120px;">
          </div>
          <button class="btn-primary">Confirmar Pedido</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
