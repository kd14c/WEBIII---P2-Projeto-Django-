<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Site de Instrumentos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Instrumentos Musicais</a>

        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'perfil' %}">Olá, {{ user.username }}</a>
                <a class="nav-link" href="{% url 'logout' %}">Sair</a>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Entrar</a>
                <a class="nav-link" href="{% url 'cadastro' %}">Cadastrar</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4 mb-4">
    {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-light text-center py-3">
    Projeto WEBIII — Sistema Django
</footer>

</body>
</html>
