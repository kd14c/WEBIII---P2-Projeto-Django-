{% extends 'core/base.html' %}
{% block title %}Finalizar Compra{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center mt-5 mb-5">

    <div class="card shadow p-4" style="max-width: 850px; width: 100%; border-radius: 12px;">

        <h3 class="mb-4">Finalizar Compra</h3>

        <div class="row">

            <!-- Imagem -->
            <div class="col-md-5 text-center">
                <img src="{{ produto.foto.url }}" alt="{{ produto.nome }}"
                     class="img-fluid rounded" style="max-height: 260px; object-fit: cover;">
            </div>

            <!-- Dados -->
            <div class="col-md-7">
                <h4>{{ produto.nome }}</h4>
                <p class="text-muted">{{ produto.descricao }}</p>

                <p><strong>Preço:</strong> R$ {{ produto.preco }}</p>
                <p><strong>Estoque:</strong> {{ produto.estoque }}</p>

                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <label class="form-label">Quantidade</label>
                    <input type="number" name="quantidade" required min="1" max="{{ produto.estoque }}" class="form-control mb-3">

                    <button class="btn btn-primary w-100">Confirmar Pedido</button>
                </form>

            </div>

        </div>

    </div>
</div>
{% endblock %}
