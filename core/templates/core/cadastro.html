{% extends 'core/base.html' %}
{% block title %}Criar Conta - {{ pagina_global.nome_do_site }}{% endblock %}

{% block content %}
<div class="container" style="max-width:520px;">
  <div class="section-card mt-4">
    <h3 class="center mb-3">Criar Conta</h3>

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-muted-2">Usuário</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-muted-2">Email</label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label text-muted-2">Senha</label>
        <input type="password" name="senha" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-muted-2">Confirmar Senha</label>
        <input type="password" name="senha2" class="form-control" required>
      </div>

      <button class="btn-primary w-100">Criar Conta</button>
    </form>
  </div>
</div>
{% endblock %}
