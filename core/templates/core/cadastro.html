{% extends 'core/base.html' %}
{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="width: 420px; border-radius: 12px;">

        <h3 class="mb-3 text-center">Criar Conta</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success w-100 mt-3">Cadastrar</button>
        </form>

        <p class="text-center mt-3">
            Já tem conta? <a href="{% url 'login' %}">Entrar</a>
        </p>

    </div>
</div>
{% endblock %}
