{% extends 'core/base.html' %}
{% block title %}Criar Conta{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4" style="border-radius: 12px;">

        <h3 class="mb-4 text-center">Criar Conta</h3>

        <!-- mensagens de erro -->
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-warning">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control mb-3" required>

            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control mb-3">

            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control mb-3" required>

            <label class="form-label">Confirmar Senha</label>
            <input type="password" name="senha2" class="form-control mb-4" required>

            <button class="btn btn-primary w-100">Criar Conta</button>
        </form>

    </div>
</div>

{% endblock %}
